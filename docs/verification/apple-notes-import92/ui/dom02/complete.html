<section class="apple-import-section" aria-label="从 Apple 备忘录导入"><h3>数据导入</h3><button class="apple-import-entry"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-input"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M2 15h10"></path><path d="m9 18 3-3-3-3"></path></svg><span><strong>从 Apple 备忘录导入</strong><small>复制笔记与附件，保留系统备忘录中的原件</small></span><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right"><path d="m9 18 6-6-6-6"></path></svg></button><div class="apple-import-panel" role="region" aria-label="Apple 备忘录导入"><div class="apple-import-heading"><h4>从 Apple 备忘录导入</h4><button type="button" aria-label="关闭 Apple 备忘录导入"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div><p>将所选笔记复制到本应用。原笔记保持不变；再次读取相同内容会自动跳过，源内容变化时保留为新副本。</p><button class="apple-import-primary">重新读取来源</button><p class="apple-import-result" role="status"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg>已复制 2 条（其中 1 条的部分格式仅在原始记录中保留），已存在 0 条，跳过 1 条</p><details open=""><summary>查看结果详情</summary><div class="apple-import-items"><div class="apple-import-result-item"><strong>合成导出失败</strong><small>源附件无法导出，未复制这条备忘录。</small></div><div class="apple-import-result-item"><strong>合成富文本</strong><small>已完整复制</small></div><div class="apple-import-result-item"><strong>合成特殊对象</strong><small>已复制，部分格式仅保存在原始记录</small><small class="apple-import-warning">部分不支持的标记或对象仅保存在原始记录中</small></div></div></details><p>原始 HTML 与来源信息保存在每条笔记末尾的“Apple 备忘录原始记录.json”文件，可随完整备份导出。</p></div></section>
