import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
 def app = gradle.rootProject.findProject(':app')
 if (app == null) return
 app.tasks.register('notesExternalRuntimeLenientProbe') {
  doLast {
   assert gradle.startParameter.offline
   def cfg = app.configurations.getByName('universalDebugRuntimeClasspath')
   def view = cfg.incoming.artifactView {
    lenient = true
    componentFilter { id -> id instanceof ModuleComponentIdentifier }
   }
   def artifacts = view.artifacts
   def resolved = artifacts.artifacts
   def failures = artifacts.failures.collect { failure -> [type:failure.class.name, message:failure.message] }
   def report = [configuration:cfg.name, resolvedExternalArtifacts:resolved.size(), failures:failures]
   new File('/private/tmp/notes-runtime-external-lenient-result-01.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
   println "NOTES_EXTERNAL_RUNTIME_RESULT=${JsonOutput.toJson(report)}"
  }
 }
}
