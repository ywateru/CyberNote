import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('notesLifecycleActualProbe') {
        doLast {
            assert gradle.startParameter.offline
            def cfg = app.configurations.getByName('universalDebugRuntimeClasspath')
            println "NOTES_ACTUAL_CONFIGURATION=${cfg.name}"
            app.repositories.each { repo ->
                if (repo.hasProperty('url')) println "NOTES_REPOSITORY=${repo.name}|${repo.url}"
            }
            def view = cfg.incoming.artifactView {
                componentFilter { id ->
                    id instanceof ModuleComponentIdentifier &&
                    id.group == 'androidx.lifecycle' &&
                    id.module == 'lifecycle-livedata' &&
                    id.version == '2.10.0'
                }
            }
            def artifacts = view.artifacts.artifacts
            assert artifacts.size() == 1 : "Expected exactly 1 target artifact, got ${artifacts.size()}"
            artifacts.each { artifact ->
                println "NOTES_ACTUAL_ARTIFACT_ID_CLASS=${artifact.id.class.name}"
                println "NOTES_ACTUAL_ARTIFACT_ID=${artifact.id.displayName}"
                println "NOTES_ACTUAL_VARIANT=${artifact.variant.displayName}"
                artifact.variant.attributes.keySet().each { key ->
                    println "NOTES_ACTUAL_ATTRIBUTE=${key.name}|${artifact.variant.attributes.getAttribute(key)}"
                }
                ['fileName', 'uri'].each { field ->
                    if (artifact.id.hasProperty(field)) println "NOTES_ACTUAL_${field.toUpperCase()}=${artifact.id[field]}"
                }
                def f = artifact.file
                def sha = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
                println "NOTES_ACTUAL_FILE=${f.absolutePath}"
                println "NOTES_ACTUAL_SHA256=${sha}"
                assert sha == '3e8c009fc88da1c52e4ed05a81269d5ac9bd405046f300307f5e3a17e201a6df'
            }
        }
    }
}
