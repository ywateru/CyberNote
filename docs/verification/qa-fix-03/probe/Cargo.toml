[package]
name = "notes-fix03-independent-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "notes-fix03-independent-probe"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
