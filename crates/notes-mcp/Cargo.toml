[package]
name = "notes-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "cybernote-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
jsonschema = { version = "0.46", default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
