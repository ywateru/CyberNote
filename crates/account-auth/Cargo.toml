[package]
name = "account-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pinned Logto native authorization and single-owner grant persistence"

[dependencies]
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["sync", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
fs2 = "0.4"
libc = "0.2"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tempfile = "3"
jsonwebtoken = { version = "9", default-features = false }
ring = "0.17"
base64 = "0.22"
