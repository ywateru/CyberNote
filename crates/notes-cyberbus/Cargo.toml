[package]
name = "notes-cyberbus"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[features]
default = []
test-key = []

[workspace]

[dependencies]
cyberbus = { path = "../../vendor/cyberbus/crates/cyberbus" }
cyberbus-auth = { git = "https://github.com/osd-pub/CyberBus.git", rev = "359465e83bd74b571a963f3d1fdc238f50169919" }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
rand = "0.8"
aes-gcm = "0.10"
zeroize = "1.8"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cyberbus-auth = { git = "https://github.com/osd-pub/CyberBus.git", rev = "359465e83bd74b571a963f3d1fdc238f50169919", features = ["platform-keyring"] }

[dev-dependencies]
cyberbus-protocol = { git = "https://github.com/osd-pub/CyberBus.git", rev = "359465e83bd74b571a963f3d1fdc238f50169919" }
prost-reflect = "0.16"
tempfile = "3"
serde_json = "1"

[profile.dev]
debug = 0
[profile.test]
debug = 0
