[package]
name = "cyberbus"
version = "0.1.0"
edition = "2021"

[features]
default = []
cloudflared = ["cyberbus-transport/cloudflared"]

[dependencies]
cyberbus-auth = { git = "https://github.com/osd-pub/CyberBus.git", rev = "359465e83bd74b571a963f3d1fdc238f50169919" }
cyberbus-protocol = { git = "https://github.com/osd-pub/CyberBus.git", rev = "359465e83bd74b571a963f3d1fdc238f50169919" }
cyberbus-transport = { git = "https://github.com/osd-pub/CyberBus.git", rev = "359465e83bd74b571a963f3d1fdc238f50169919", features = ["websocket"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
sha2 = "0.10"
hex = "0.4"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
