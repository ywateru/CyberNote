[package]
name = "cyberbus-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
build = "build.rs"
description = "CyberBus v1 generated Protobuf contracts, bounded codecs and authenticated Noise streams"

[dependencies]
bytes = "1.11"
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
snow = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "time", "rt", "macros", "sync"] }
zeroize = "1.8"
semver = "1.0"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "test-util"] }
