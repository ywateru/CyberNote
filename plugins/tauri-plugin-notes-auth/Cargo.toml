[package]
name = "tauri-plugin-notes-auth"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-notes-auth"
description = "Host-only native hosted-login containers; no renderer commands"
license = "MIT"

[dependencies]
tauri = { version = "=2.12.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }
cc = "1"

[workspace]
