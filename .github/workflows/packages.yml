name: Build native arm64 packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check versions and source types
        run: |
          pnpm version:check
          pnpm typecheck
      - name: Install Rust for isolated build-identity fixtures
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Test release tooling and account command boundaries
        run: |
          node --test \
            scripts/publish/build-info.test.mjs \
            scripts/verification/settings121-release-identity.test.mjs \
            scripts/verification/settings121-release-hidden-index.test.mjs \
            scripts/publish/package-identity.test.mjs \
            scripts/publish/policy.test.mjs \
            scripts/publish/stage-packages.test.mjs \
            scripts/verification/cyberbus-command.test.mjs \
            scripts/verification/account109-status-dto.test.mjs \
            scripts/verification/account109-login-surfaces.test.mjs \
            scripts/verification/account109-android-files.test.mjs
  macos-arm64:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Set isolated Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cybernote-macos-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require real arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check retained source and script closure
        run: |
          pnpm version:check
          pnpm typecheck
      - name: Build macOS arm64 app
        run: pnpm exec tauri build --target aarch64-apple-darwin --bundles app --ci
      - name: Stage exact package and notices
        run: python3 scripts/publish/stage-packages.py --platform macos
      - uses: actions/upload-artifact@v7
        with:
          name: CyberNote-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            release-packages/CyberNote-macos-arm64.zip
            release-packages/CyberNote-macos-arm64.dmg
            release-packages/CyberNote-macos-arm64-notices.zip
            release-packages/CyberNote-macos-arm64.json
            release-packages/CyberNote-macos-arm64.sha256
  android-arm64:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CYBERNOTE_ANDROID_APPLICATION_ID: com.local.notesclone
    steps:
      - name: Set isolated Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cybernote-android-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install exact SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check retained source and script closure
        run: |
          pnpm version:check
          pnpm typecheck
      - name: Assemble unsigned release arm64 APK
        run: pnpm exec tauri android build --target aarch64 --apk --ci
      - name: Stage exact package and notices
        run: python3 scripts/publish/stage-packages.py --platform android
      - uses: actions/upload-artifact@v7
        with:
          name: CyberNote-android-arm64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            release-packages/CyberNote-android-arm64-unsigned.apk
            release-packages/CyberNote-android-arm64-notices.zip
            release-packages/CyberNote-android-arm64.json
            release-packages/CyberNote-android-arm64.sha256
