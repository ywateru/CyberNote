name: Build and publish native arm64 packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check versions and source types
        run: |
          pnpm version:check
          pnpm typecheck
      - name: Install Rust for isolated build-identity fixtures
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Test release tooling and account command boundaries
        run: |
          node --test \
            scripts/publish/build-info.test.mjs \
            scripts/verification/settings121-release-identity.test.mjs \
            scripts/verification/settings121-release-hidden-index.test.mjs \
            scripts/publish/package-identity.test.mjs \
            scripts/publish/policy.test.mjs \
            scripts/publish/stage-packages.test.mjs \
            scripts/verification/cyberbus-command.test.mjs \
            scripts/verification/account109-status-dto.test.mjs \
            scripts/verification/account109-login-surfaces.test.mjs \
            scripts/verification/account109-android-files.test.mjs
  macos-arm64:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Set isolated Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cybernote-macos-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require real arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check retained source and script closure
        run: |
          pnpm version:check
          pnpm typecheck
      - name: Build macOS arm64 app
        run: pnpm exec tauri build --target aarch64-apple-darwin --bundles app --ci
      - name: Stage exact package and notices
        run: python3 scripts/publish/stage-packages.py --platform macos
      - uses: actions/upload-artifact@v7
        with:
          name: CyberNote-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            release-packages/CyberNote-macos-arm64.zip
            release-packages/CyberNote-macos-arm64-notices.zip
            release-packages/CyberNote-macos-arm64.json
            release-packages/CyberNote-macos-arm64.sha256
  android-arm64:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CYBERNOTE_ANDROID_APPLICATION_ID: com.local.notesclone
    steps:
      - name: Set isolated Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cybernote-android-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install exact SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check retained source and script closure
        run: |
          pnpm version:check
          pnpm typecheck
      - name: Assemble unsigned release arm64 APK
        run: pnpm exec tauri android build --target aarch64 --apk --ci
      - name: Stage exact package and notices
        run: python3 scripts/publish/stage-packages.py --platform android
      - uses: actions/upload-artifact@v7
        with:
          name: CyberNote-android-arm64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            release-packages/CyberNote-android-arm64-unsigned.apk
            release-packages/CyberNote-android-arm64-notices.zip
            release-packages/CyberNote-android-arm64.json
            release-packages/CyberNote-android-arm64.sha256
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [macos-arm64, android-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate tag and package inventory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$RELEASE_TAG" in
            "v$version"|"v$version-"*) ;;
            *) echo "Tag $RELEASE_TAG does not match package version $version"; exit 1 ;;
          esac
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$RELEASE_TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "CyberNote ${RELEASE_TAG#v}" \
            --notes "Automated arm64 packages built and staged by GitHub Actions. The macOS app is ad-hoc signed and not notarized; the Android APK is unsigned and requires distributor signing before installation. Package identity, SHA-256 receipts and third-party notices are included." \
            "${prerelease[@]}"
