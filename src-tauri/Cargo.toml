[package]
name = "notes-clone"
version = "0.2.6"
description = "Local notes for Mac and Android"
edition = "2021"
[features]
access-boundary-proof = []
sync-e2e = []
[lib]
name = "notes_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
notes-cyberbus = { path = "../crates/notes-cyberbus" }
prost-types = "0.14"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notes-auth = { path = "../plugins/tauri-plugin-notes-auth" }
tauri-plugin-notes-media = { path = "../plugins/tauri-plugin-notes-media" }
tauri-plugin-notes-scan = { path = "../plugins/tauri-plugin-notes-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
flate2 = "1"
crc32fast = "1"
unicode-normalization = "0.1"
fs2 = "0.4"
libc = "0.2"
html5ever = "0.39"
rand = "0.8"
snow = "0.9.6"
url = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "process"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", features = ["sink"] }
# Bounded loopback bodies and derived thumbnails; no native WebView dependency.
bytes = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Reuse image's existing PNG decoder for bounded cache-body/CRC validation.
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.45", default-features = false, features = ["text"] }
ttf-parser = "0.25.1"
roxmltree = "0.20"
[target.'cfg(target_os = "android")'.dependencies]
cyberbus-auth = { git = "https://github.com/osd-pub/CyberBus.git", rev = "359465e83bd74b571a963f3d1fdc238f50169919" }
jni = "0.21"
ndk-context = "0.1"
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notes-ui = { path = "../plugins/tauri-plugin-notes-ui" }
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
p384 = { version = "0.13", features = ["pem", "pkcs8"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["hooks"] }
