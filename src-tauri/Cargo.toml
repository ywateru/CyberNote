[package]
name = "notes-clone"
version = "0.1.0"
description = "Local notes for Mac and Android"
edition = "2021"
[lib]
name = "notes_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
[dev-dependencies]
tempfile = "3"
