[package]
name = "notes-clone"
version = "0.1.0"
description = "Local notes for Mac and Android"
edition = "2021"
[features]
access-boundary-proof = []
[lib]
name = "notes_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notes-scan = { path = "../plugins/tauri-plugin-notes-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
rand = "0.8"
snow = "0.9.6"
url = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", features = ["sink"] }
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notes-ui = { path = "../plugins/tauri-plugin-notes-ui" }
[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["hooks"] }
