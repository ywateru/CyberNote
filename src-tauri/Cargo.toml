[package]
name = "notes-clone"
version = "0.1.0"
description = "Local notes for Mac and Android"
edition = "2021"
[features]
access-boundary-proof = []
sync-e2e = []
[lib]
name = "notes_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notes-media = { path = "../plugins/tauri-plugin-notes-media" }
tauri-plugin-notes-scan = { path = "../plugins/tauri-plugin-notes-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
html5ever = "0.39"
rand = "0.8"
snow = "0.9.6"
url = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", features = ["sink"] }
# Bounded loopback bodies and derived thumbnails; no native WebView dependency.
bytes = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Reuse image's existing PNG decoder for bounded cache-body/CRC validation.
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.45", default-features = false, features = ["text"] }
ttf-parser = "0.25.1"
roxmltree = "0.20"
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notes-ui = { path = "../plugins/tauri-plugin-notes-ui" }
[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["hooks"] }
