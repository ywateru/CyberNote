[package]
name = "evolve112-host-module-tests"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "test-util"] }
futures-util = { version = "0.3", features = ["sink"] }
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
[profile.dev]
debug = 0
