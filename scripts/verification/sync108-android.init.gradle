// Opt in only: pass --init-script to Gradle when building the isolated test APK.
// Production/release identity and the Java/Kotlin namespace remain unchanged.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                if (android.defaultConfig.applicationId != 'com.local.notesclone') {
                    throw new GradleException('sync108 requires the expected production base ID')
                }
                android.buildTypes.getByName('debug').applicationIdSuffix = '.sync108'
                def resources = new File(project.layout.buildDirectory.get().asFile, 'sync108-res/values')
                resources.mkdirs()
                new File(resources, 'strings.xml').text = '''<resources>
  <string name="app_name">CyberNote Sync Test</string>
  <string name="main_activity_title">CyberNote Sync Test</string>
</resources>'''
                android.sourceSets.getByName('debug').res.srcDir(resources.parentFile)
            }
        }
    }
}
