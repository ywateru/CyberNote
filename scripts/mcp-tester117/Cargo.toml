[package]
name = "mcp-tester117-checks"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "tests.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "time", "io-util", "net", "sync"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
[profile.dev]
debug = 0
